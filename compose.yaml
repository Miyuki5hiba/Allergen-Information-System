services:
  mysql:
    image: 'mysql:latest'
    container_name: allergen-mysql
    environment:
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pverysecret"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - allergen-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allergen-app
    depends_on:
      mysql:
        condition: service_healthy
      goodnightworld:
        condition: service_started
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/mydatabase?allowPublicKeyRetrieval=true&useSSL=false'
      - 'SPRING_DATASOURCE_USERNAME=myuser'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
      - 'GOODNIGHT_URL=http://goodnightworld:8085'
    ports:
      - '8080:8080'
    networks:
      - allergen-network
    restart: unless-stopped

  goodnightworld:
    build:
      context: ../GoodNight
      dockerfile: Dockerfile
    container_name: goodnightworld
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - 'FEIGN_CLIENT_CONFIG_DYNAMIC_RECEIVER_URL=http://allergen-app:8080/response'
    ports:
      - '8085:8085'
    depends_on:
      postgres:
        condition: service_started
    networks:
      - allergen-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: goodnightworld-postgres
    environment:
      POSTGRES_DB: goodnightdb
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - allergen-network
    restart: unless-stopped

volumes:
  mysql-data:
  postgres-data:

networks:
  allergen-network:
    driver: bridge
